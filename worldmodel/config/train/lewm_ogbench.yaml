defaults:
  - _self_
  - data: ogbench_play

output_model_name: lewm_ogbench
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 64
patch_size: 8       # 64/8=8 → 8×8=64 tokens per frame; each patch=8×8=64px
encoder_scale: tiny
                    # patch_size=4 would give 16px patches — too noisy for JEPA

trainer:
  max_epochs: 20    # Matches original 10-epoch gradient budget on LeWM dataset:
                    #   Original : 10 × (10K eps × 181 starts / 128) ≈ 141K iters
                    #   OGBench  : 20 × ( 1K eps × 982 starts / 128) ≈ 153K iters
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: False    # Keep separate from the LeWM wandb project

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

dump_object: True
